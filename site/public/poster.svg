<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Placeholder poster for Helix film Descent">
  <title>Descent — placeholder poster</title>
  <desc>Vector fallback for public/poster.jpg. A dark teal-to-black gradient with the film title. Not a generated frame.</desc>
  <defs>
    <radialGradient id="cave" cx="50%" cy="80%" r="62%">
      <stop offset="0%" stop-color="#2ec4bd" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#12706f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="forest" cx="12%" cy="9%" r="46%">
      <stop offset="0%" stop-color="#6a5a24" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b09"/>
      <stop offset="55%" stop-color="#050d0d"/>
      <stop offset="100%" stop-color="#02070a"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.78"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="g2" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="url(#base)"/>
    <rect width="1920" height="1080" fill="url(#forest)"/>
    <rect width="1920" height="1080" fill="url(#cave)"/>
    <rect width="1920" height="1080" fill="url(#vig)"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8e2d2">
    <text x="110" y="906" font-size="54" letter-spacing="14" opacity="0.86">DESCENT</text>
    <text x="112" y="968" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#c9d6cc" opacity="0.62">a single take into the light</text>
  </g>
  <text x="112" y="1010" font-family="Menlo, ui-monospace, monospace" font-size="20" fill="#7fd8ce" opacity="0.62">HELIX FILM 01   /   49 SECONDS   /   PLACEHOLDER FRAME</text>
  <text x="1810" y="120" text-anchor="end" font-family="Menlo, ui-monospace, monospace" font-size="18" fill="#d9a05b" opacity="0.5">NOT A GENERATED FRAME</text>
</svg>
